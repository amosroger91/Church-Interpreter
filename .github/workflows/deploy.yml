name: Build site

# GitHub Pages serves the root of `main`. When the source changes, rebuild
# the site and commit the built files (index.html, assets/, sw.js, ...) to
# the repository root.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run publish-site
      - name: Commit built site
        run: |
          git add -A index.html assets sw.js manifest.webmanifest icon.svg .nojekyll workbox-*.js
          if git diff --cached --quiet; then
            echo "Built site is up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build site"
            git push
          fi
