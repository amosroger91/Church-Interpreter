name: Translation quality benchmark

# Runs the interpretation benchmark (eval/eval.mjs) against the real models.
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/lib/**', 'eval/**']

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: public/models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run fetch-models
      - run: npm run eval | tee eval-results.txt
      - run: cat eval-results.txt >> "$GITHUB_STEP_SUMMARY"
