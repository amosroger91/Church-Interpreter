name: Translation quality benchmark

# Runs the interpretation benchmark (eval/eval.mjs) against the real models,
# in both directions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/lib/**', 'eval/**']

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        direction: [en-es, es-en]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: public/models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run fetch-models
      - name: Benchmark ${{ matrix.direction }}
        run: node eval/eval.mjs --dir=${{ matrix.direction }} --only=offline,fragment-balanced,simul-balanced --verbose 2>&1 | grep -v WARNING | tee eval-results.txt
      - run: |
          echo '## ${{ matrix.direction }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -8 eval-results.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
